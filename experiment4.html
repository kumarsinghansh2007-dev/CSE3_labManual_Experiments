<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>experiment4</title>
</head>
<body>
  <div style="width: 400px; margin: 20px auto; border-top: 3px solid black; border-left: 1px solid #ccc; border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 10px;">
        <center>
            <h1>Hotel Room Booking Form</h1>

            <form action="#" method="post">
                <p>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </p>

                <p>
                    <label for="checkin">Check-in Date:</label>
                    <input type="date" id="checkin" name="checkin">
                </p>

                <p>
                    <label for="checkout">Check-out Date:</label>
                    <input type="date" id="checkout" name="checkout">
                </p>

                <p>
                    <label for="roomtype">Room Type:</label>
                    <select id="roomtype" name="roomtype">
                        <option value="single">Single Room</option>
                        <option value="double">Double Room</option>
                        <option value="suite">Suite</option>
                    </select>
                </p>

                <p>
                    <label for="guests">Number of Guests:</label>
                    <input type="number" id="guests" name="guests" min="1" size="5">
                </p>

                <p>
                    <label for="requests">Special Requests:</label><br>
                    <textarea id="requests" name="requests" rows="4" cols="40"></textarea>
                </p>

                <p>
                    <input type="submit" value="Book Now">
                    <input type="reset" value="Reset Form">
                </p>
            </form>
        </center>
    </div>
    
</body>
</html>
